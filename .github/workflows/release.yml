name: Release

# Push a tag like v0.2.0 to build a universal macOS binary and publish it as a
# GitHub Release. install.sh and `xcb --update` download from the latest release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      ASSET: xcb-macos-universal.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        run: |
          version="${GITHUB_REF_NAME#v}"
          file_version=$(tr -d '[:space:]' < VERSION)
          swift_version=$(sed -n 's/^let xcbVersion = "\(.*\)"/\1/p' Sources/XCBCore/Version.swift)
          if [[ "$version" != "$file_version" || "$version" != "$swift_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file_version) and Version.swift ($swift_version). Run scripts/bump-version.sh and commit before tagging."
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin_dir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          lipo -info "$bin_dir/xcb"
          "$bin_dir/xcb" --version | grep -qx "xcb ${GITHUB_REF_NAME#v}"
          mkdir dist
          tar -czf "dist/$ASSET" -C "$bin_dir" xcb
          (cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256")

      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s dist/notes.md ]]; then
            notes=(--notes-file dist/notes.md)
          else
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME#v}; using generated notes."
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" \
            --title "$GITHUB_REF_NAME" "${notes[@]}"
