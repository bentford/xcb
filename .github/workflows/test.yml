name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: brew install bats-core

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: CLI tests
        run: bats tests/
