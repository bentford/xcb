name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: apt-get update && apt-get install -y bats

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: CLI tests
        run: bats tests/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: brew install bats-core

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: CLI tests
        run: bats tests/
